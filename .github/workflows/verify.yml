name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build + verify（Node 24 · ${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # PR 代码会在本 job 里执行 verify 脚本；不要把 GITHUB_TOKEN 持久化到 runner 工作区
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: 构建客户端产物（client.js 与源码一致）
        run: node build.mjs

      - name: 全量验证（宿主冒烟 / 安全 / 内核 / 工具 / 面板 / 开源就绪 / 打包 / 自检）
        run: node verify/all.mjs

      - name: 健康检查
        run: node scripts/health-check.mjs

      - name: 打包内容断言（npm pack --dry-run，files 白名单有效）
        run: node verify/pack.mjs

      - name: README 版本一致性
        run: node scripts/check-readme-version.mjs
